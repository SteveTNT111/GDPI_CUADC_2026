# =====================================================================
# CUADC auto_drop_test.py 配置（单一事实源）
# Web UI 读写本文件；auto_drop_test.py 运行时读本文件。
# 解析优先级：命令行 --ros-args -p 明确覆盖 > 本文件 > 脚本内置默认。
# 缺文件/缺字段一律回落内置默认，不会因此崩溃。
# 生成时间随保存刷新；注释含单位与合法范围。
# =====================================================================

# ===== 依赖自启 / 收尾 =====
launch:
  auto_start_mavros: false  # （是否由任务脚本自动拉起 MAVROS）
  auto_start_detector: true  # （是否自动拉起 相机+识别）
  auto_start_servo_test: true  # （是否自动拉起 舵机测试节点）
  auto_shutdown_children: true  # （任务结束是否自动收尾它拉起的子进程（空中永远保留 MAVROS））
  mavros_fcu_url: "udp://:14555@192.168.13.14:14550"  # （MAVROS 飞控 URL（真机网口 UDP / 仿真 tcp 5760））
  detector_package: cuadc_visionY26  # （识别包：cuadc_vision 或 cuadc_visionY26；可选: cuadc_vision/cuadc_visionY26）
  detector_launch: detector_node.launch.py  # （识别 launch 文件名）
  camera_source: realsense  # （相机源：仿真 gazebo / 真机 realsense；可选: gazebo/realsense）
  detector_show_window: true  # （识别是否弹标注窗口）
  detector_auto_open_view: true  # （拉起识别节点后默认拉起识别画面（浏览器端自动打开识别画面；识别端仅在有人看时发布标注图））

# ===== 任务模式与航线 =====
mission:
  flight_only_mode: false  # （仅飞行航线验证（禁视觉/舵机/投放））
  flight_only_pattern_laps: 1  # （仅飞行模式花形圈数；min=1）
  flight_only_search_altitude_m: 3  # （仅飞行模式搜索高度（相对起飞点；完整任务搜索高度见 search_altitude_m）；m；min=0.1）
  flight_only_continue_to_recon: false  # （仅飞行模式是否继续飞往侦察区）
  aim_only_mode: false  # （仅飞行+仅瞄准：投放区搜索识别到 3 个桶后切入瞄准（只对准，不投放））
  survey_only_mode: false  # （仅搜索记录：飞往投放区做 W/Z/I 视觉搜索并记录桶坐标后返航（不瞄准、不投放；与 aim_only_mode 互斥））
  ground_test: false  # （地面测试（不切模式/不解锁））
  full_mission_mode: true  # （完整任务模式（总开关）：true=执行完整自主飞行——切 GUIDED→解锁→起飞→飞往投放区→搜索→瞄准/投放→（可去侦察区）→RTL；可叠加 aim_only_mode/survey_only_mode/recon_enabled 降级；false=仅做依赖/航点/授权检查，不切模式、不解锁、不起飞（干跑检查））
  enable_b_dropper: true  # （启用 B 投放）
  dry_run: false  # （干跑：仅执行瞄准/投放流程，不实际控制舵机（不发 /servo/cmd）；但终端与识别画面仍会显示 drop）
  close_after_drop: false  # （投放后关闭）
  min_bucket_count: 1  # （最少目标数；min=1）
  area_search_pattern: W  # （区域搜索花形；可选: W/Z/I）
  takeoff_altitude_m: 3  # （起飞高度（相对起飞点）；m；min=0.1）
  drop_zone_transit_altitude_m: 3  # （投放区航程高度；m；min=0.1）
  drop_zone_distance_m: 20  # （投放区距离；m；min=0.1）
  recon_zone_distance_m: 60  # （侦察区距离；m；min=0.1）
  recon_altitude_m: 5  # （侦察高度；m；min=0.1）
  recon_hold_s: 5  # （侦察悬停时间；s；min=0.1）
  search_altitude_m: 3  # （投放区搜索高度（相对起飞点；起飞后先到该高度，再在该高度飞往投放区做 W/Z/I 搜索）；m；min=0.1）
  drop_zone_bearing_deg: -1  # （投放区/侦察区锁定航向（度，0=北顺时针；<0=用起始航向（真机默认：操作手把机头对准中线）；0..360=固定航向，仅仿真在起飞前 EKF 偏航未对齐时用 90 对齐场地中线）；deg；min=-1.0 max=360.0）
  recon_enabled: false  # （完成投放/搜索后是否飞往侦察区（默认 false=直接 RTL，对应测试流程 5/6；true=飞往侦察区悬停后再 RTL，对应流程 7））
  record_buckets: true  # （是否把识别到的桶坐标原子写落盘 logs/buckets（供 WebUI/赛后分析））
  bucket_ratio_ref_200: 0.3  # （200mm 桶物理尺寸代理值（m，depth*sqrt((bbox_w/fx)^2+(bbox_h/fy)^2)，请用相机实测填入）；min=0.001 max=10.0）
  bucket_ratio_tol: 0.15  # （比值分档容差：比值>ref*(1+tol)=大号、<ref*(1-tol)=小号、之间=中号（物理尺寸代理，大=大号）；min=0.0 max=1.0）
  bucket_ratio_invert: false  # （尺寸代理方向开关：默认比值大=桶大；仅在标定实测方向相反时置 true）
  bucket_assoc_distance_m: 0.6  # （同一桶 ENU 关联门限（米）：须明显小于场地最小桶距（规则三筒随机摆放）、明显大于观测噪声；调大更抗噪但近距两桶会并档，调小反之；m；min=0.05 max=2.0）
  bucket_record_dir: ~/ROS2_CUADC2026/logs/buckets  # （桶坐标记录目录（原子写 buckets_<时间戳>.json 并覆盖 buckets_latest.json））
  front_dropper: A  # （前投放器舵机（A/B）：前投用'前'准星与前坐标，后投用'后'；可选: A/B）
  crosshair_offset_m: 0.05  # （准星偏移（m）：虚拟相机原点沿机体系 X ±该值（须与 detector 的 dual_offset_m 一致）；m；min=0.001 max=1.0）
  aim_cam_align_threshold_m: 0.03  # （对准触发阈值（m）：桶中心相对对应准星的相机系差值小于它即判已对准，触发投放；m；min=0.001 max=1.0）

# ===== 区域搜索 =====
search:
  drop_zone_width_m: 8  # （投放区宽度（机身边方向 / 横向；场地规则 8m）；m；min=0.1）
  drop_zone_length_m: 5  # （投放区长度（机身前后 / 沿航线方向；场地规则 5m）；m；min=0.1）
  detect_range_ref_altitude_m: 3  # （识别范围参考高度（相对起飞点）：下面宽/长是在该高度测得的地面覆盖；实际按 实际搜索高度/参考高度 线性折算；m；min=0.1）
  detect_range_width_m: 2.25  # （识别范围宽度（机身边方向 / 画面横向；参考高度下）；m；min=0.1）
  detect_range_length_m: 1.5  # （识别范围长度（机身前后方向 / 画面纵向；参考高度下）；m；min=0.1）
  area_search_timeout_s: 120  # （区域搜索超时；s；min=0.1）
  area_search_waypoint_tolerance_m: 0.25  # （区域搜索到点容差；m；min=0.01）
  area_search_height_tolerance_m: 0.2  # （区域搜索高度容差；m；min=0.01）
  area_search_dwell_s: 0.5  # （区域搜索点停留；s；min=0.1）
  second_target_search_timeout_s: 30  # （第二目标搜索超时；s；min=0.1）
  reuse_area_search_anchor_for_b: true  # （B 复用区域搜索锚点）

# ===== 瞄准 / 投放 =====
aim:
  coarse_align_height_m: 2  # （粗对准高度；m；min=0.1）
  fine_align_height_m: 1.7  # （精对准高度；m；min=0.1）
  target_drop_height_m: 1.5  # （投放高度；m；min=0.1）
  coarse_align_threshold_m: 0.45  # （粗对准阈值；m；min=0.01）
  fine_align_threshold_m: 0.2  # （精对准阈值；m；min=0.01）
  align_threshold_m: 0.15  # （对准阈值；m；min=0.01）
  height_tolerance_m: 0.15  # （高度容差；m；min=0.01）
  stable_time_s: 0.5  # （稳定判定时间；s；min=0.01）
  acquire_stable_time_s: 0.8  # （目标获取稳定时间；s；min=0.01）
  phase_stable_time_s: 0.5  # （阶段稳定时间；s；min=0.01）
  after_a_delay_s: 3  # （A 后 B 间隔；s；min=0.01）
  require_distinct_b_target: true  # （B 需要不同于 A 的目标）
  distinct_target_distance_m: 0.6  # （A/B 目标最小间距；m；min=0.01）
  setpoint_interval_s: 0.1  # （setpoint 发布间隔；s；min=0.01）

# ===== 视觉 =====
vision:
  vision_min_confidence: 0.3  # （视觉最低置信度；min=0.0 max=1.0）

# ===== 舵机（与 servo_test.py 对齐，#43 真机 A1/A2=SERVO9/10） =====
servo:
  servo_a_channel: 9  # （舵机 A 输出通道（#43 真机 AUX1=SERVO9）；min=1 max=16）
  servo_b_channel: 10  # （舵机 B 输出通道（#43 真机 AUX2=SERVO10）；min=1 max=16）
  pwm_open: 1500  # （打开 PWM；min=800 max=2200）
  pwm_close: 1000  # （关闭 PWM；min=800 max=2200）
  enable_ch5: true  # （启用舵机 A（沿用源命名 ch5））
  enable_ch6: true  # （启用舵机 B（沿用源命名 ch6））

# ===== 航点 / 容差 =====
waypoint:
  waypoint_tolerance_m: 1  # （航点到点容差；m；min=0.01）
  waypoint_vertical_tolerance_m: 0.4  # （航点垂直容差；m；min=0.01）
  waypoint_arrival_hold_s: 1  # （到点保持时间；s；min=0.01）
  waypoint_timeout_s: 120  # （航点超时；s；min=0.1）

# ===== 超时 / 恢复（仿真低 RTF 需放宽；真机用默认） =====
timeouts:
  state_timeout_s: 5  # （state 新鲜度超时；s；min=0.1）
  guided_state_grace_s: 10  # （GUIDED state 宽限；s；min=0.1）
  pose_timeout_s: 5  # （pose 新鲜度超时；s；min=0.1）
  guided_pose_grace_s: 10  # （GUIDED pose 宽限；s；min=0.1）
  navigation_timeout_s: 5  # （导航数据超时；s；min=0.1）
  navigation_grace_s: 10  # （导航数据宽限；s；min=0.1）
  connection_loss_grace_s: 20  # （链路丢失宽限；s；min=0.1）
  connection_timeout_s: 30  # （连接超时；s；min=0.1）
  mode_timeout_s: 8  # （模式切换超时；s；min=0.1）
  takeoff_timeout_s: 40  # （起飞超时；s；min=0.1）
  rtl_timeout_s: 240  # （RTL 超时；s；min=0.1）
  service_retry_attempts: 1  # （服务重试次数；min=1）

# ===== 目标锁定 / 滤波（进阶） =====
target_lock:
  target_lock_center_threshold_m: 0.2  # （锁定中心阈值；m；min=0.01）
  target_lock_window_s: 0.5  # （锁定窗口；s；min=0.01）
  target_lock_min_samples: 5  # （锁定最少样本；min=2）
  target_lock_max_xy_span_m: 0.1  # （锁定 XY 最大跨度；m；min=0.01）
  target_lock_max_d_span_m: 0.15  # （锁定深度最大跨度；m；min=0.01）

# ===== 目标丢失搜索 / 滤波（进阶） =====
search_spin:
  target_filter_alpha: 0.25  # （目标滤波系数(0,1]；min=0.001 max=1.0）
  max_target_jump_m: 0.8  # （目标跳变上限；m；min=0.01）
  brief_loss_s: 0.5  # （短暂丢失时间；s；min=0.0）
  loss_hover_s: 2  # （丢失悬停时间；s；min=0.0）
  reacquire_height_m: 2  # （重捕获高度；m；min=0.01）
  search_start_radius_m: 0.3  # （搜索起始半径；m；min=0.01）
  search_radius_step_m: 0.3  # （搜索半径步长；m；min=0.01）
  search_max_radius_m: 1.2  # （搜索最大半径；m；min=0.01）
  search_dwell_s: 1.5  # （搜索停留时间；s；min=0.01）
  target_loss_timeout_s: 30  # （目标丢失超时；s；min=0.01）

# ===== 速度 / 步长限幅（进阶） =====
speeds:
  max_horizontal_setpoint_distance_m: 0.6  # （水平 setpoint 最大步距（命令点单次朝目标挪动的上限；与速率一起决定航线/搜索快慢）；m；min=0.01）
  max_vertical_setpoint_distance_m: 0.2  # （垂直 setpoint 最大步距（爬升/下降命令点单次挪动上限）；m；min=0.01）
  max_horizontal_setpoint_rate_mps: 0.25  # （水平 setpoint 速率（航线/搜索/瞄准的水平速度主旋钮：命令点以该速率向前挪，飞机跟飞）；m/s；min=0.01）
  max_vertical_setpoint_rate_mps: 0.2  # （垂直 setpoint 速率（爬升/下降速度主旋钮）；m/s；min=0.01）
  phase_max_horizontal_speed_mps: 0.2  # （阶段水平最大速度（瞄准阶段判定阈值：实测速度高于它不计入对准/阶段稳定，不限制飞行速度）；m/s；min=0.01）
  phase_max_vertical_speed_mps: 0.15  # （阶段垂直最大速度（瞄准阶段判定阈值，不限制飞行速度）；m/s；min=0.01）
  max_horizontal_speed_mps: 0.1  # （总体水平最大速度（最终停稳判定阈值：实测速度高于它不算停稳，不限制飞行速度）；m/s；min=0.01）
  max_vertical_speed_mps: 0.1  # （总体垂直最大速度（最终停稳判定阈值，不限制飞行速度）；m/s；min=0.01）

# ===== 其它依赖 / 遥测超时（进阶） =====
deps:
  dependency_restart_attempts: 0  # （依赖重启次数；min=0）
  dependency_restart_backoff_s: 2  # （依赖重启退避；s；min=0.0）
  detector_ready_timeout_s: 30  # （识别就绪超时；s；min=0.01）
  servo_ready_timeout_s: 20  # （舵机就绪超时；s；min=0.01）
  enroute_detect_stable_s: 0.3  # （途中检测稳定时间；s；min=0.01）
  aim_timeout_s: 40  # （瞄准超时；s；min=0.01）
  aim_info_timeout_s: 1  # （aim_info 新鲜度超时；s；min=0.01）
  service_timeout_s: 10  # （服务调用超时；s；min=0.01）
  servo_wait_timeout_s: 20  # （等待舵机订阅者超时；s；min=0.01）
  close_delay_s: 0.8  # （关闭延时；s；min=0.0）
  local_position_rate_hz: 10  # （位姿标称频率；Hz；min=0.01）
  diagnostic_log_interval_s: 1  # （诊断日志间隔；s；min=0.01）
  takeoff_started_threshold_m: 0.3  # （起飞已开始阈值；m；min=0.01）
  service_retry_backoff_s: 0.5  # （服务重试退避；s；min=0.0）
